<html>
    <head>
        <title>
            Registration form
        </title>
    </head>
    <body>
        <h2 align="center">Simple Registration Form</h2><hr/>
        <form>
                <p>Name: &nbsp; &nbsp;<input type="text" ></p>
                <p>Contact Number: &nbsp; &nbsp;<input type="text"></p>
                <p>Email: &nbsp; &nbsp;<input type="text" title="Enter your mail id"></p>
                <p>Date of Birth: &nbsp; &nbsp;<input type="text" ></p>
                <h5>Gender:</h5><p> MALE <input type="radio"> &nbsp; &nbsp;FEMALE <input type="radio"></p>
                <h5>Languages Known:</h5> <h6> English <input type="checkbox"></h6> <h6> Hindi <input type="checkbox"></h6> <h6> Telugu <input type="checkbox"></h6> <h6> Kannada <input type="checkbox"></h6>
                    <input type="submit" placeholder="submit">
                    <input type="reset" placeholder="reset">
            </form>
        </body>
</html>
